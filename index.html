<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>kaelyn's computer</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div id="boot" aria-live="polite">
   <pre id="boot-log"></pre>
   <p class="boot-skip">press any key to skip</p>
 </div>
 <header id="menubar">
   <div class="menu-left">
     <button class="logo" data-menu="os" aria-label="system menu">◐</button>
     <span id="app-name">finder</span>
     <button data-menu="file">file</button>
     <button data-menu="view">view</button>
     <button data-menu="go">go</button>
     <button data-menu="help">help</button>
   </div>
   <div class="menu-right">
     <svg class="status-icon" viewBox="0 0 20 14" aria-hidden="true"><path d="M2 5.2a11.5 11.5 0 0 1 16 0M4.8 8a7.5 7.5 0 0 1 10.4 0M7.6 10.8a3.5 3.5 0 0 1 4.8 0"/></svg>
     <svg class="status-icon battery" viewBox="0 0 26 14" aria-hidden="true"><rect x="1" y="2" width="21" height="10" rx="3"/><path d="M24.5 5.5v3"/><rect x="3.2" y="4.2" width="13" height="5.6" rx="1.4" class="fill"/></svg>
     <span id="clock"></span>
   </div>
 </header>
 <main id="desktop">
   <div id="icons"></div>
 </main>
 <nav id="dock" aria-label="dock"></nav>
 <div id="ctx" class="dropdown" hidden></div>
 <div id="toast" role="status"></div>
 <script src="data.js"></script>
 <script src="app.js"></script>
</body>
</html>
